name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  build-and-deploy:
    name: Build & Trigger Production Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Build TypeScript Project
        run: |
          cd backend
          npm run build

      - name: Trigger Coolify Auto-Deploy Webhook (Kamatera VPS)
        if: env.COOLIFY_WEBHOOK_URL != ''
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          echo "Triggering Coolify auto-deployment on Kamatera..."
          curl -X POST "$COOLIFY_WEBHOOK_URL"
